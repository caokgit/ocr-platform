apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
patches:
  - target: {kind: ExternalSecret, name: podinfo-config}
    patch: |
      - op: replace
        path: /spec/data/0/remoteRef/key
        value: ocr-platform/dev/podinfo
      - op: replace
        path: /spec/refreshInterval
        value: 1h
  - target: {kind: HTTPRoute, name: podinfo}
    patch: |
      - op: replace
        path: /spec/hostnames/0
        value: podinfo.ocr-platform.example
  - target: {kind: Deployment, name: podinfo}
    patch: |
      - op: replace
        path: /spec/replicas
        value: 2
