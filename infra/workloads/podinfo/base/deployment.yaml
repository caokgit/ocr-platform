# podinfo: a small Go web app with Prometheus metrics and fault switches, standing in for an API.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: podinfo
  namespace: apps
  labels: {app.kubernetes.io/name: podinfo}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: podinfo}
  template:
    metadata:
      labels: {app.kubernetes.io/name: podinfo}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      # Spread replicas over nodes and zones, so one node or zone going away (a spot reclaim) takes one replica.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {app.kubernetes.io/name: podinfo}
      terminationGracePeriodSeconds: 30
      containers:
        - name: podinfo
          image: ghcr.io/stefanprodan/podinfo:6.17.0
          command: ["./podinfo", "--port=9898", "--port-metrics=9797", "--level=info"]
          env:
            - name: PODINFO_UI_MESSAGE
              valueFrom:
                secretKeyRef: {name: podinfo-config, key: message}
          ports:
            - {name: http, containerPort: 9898}
            - {name: metrics, containerPort: 9797}
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: http}
          resources:
            requests: {cpu: 50m, memory: 32Mi}
            limits: {memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: data, mountPath: /data}
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: podinfo
  namespace: apps
  labels: {app.kubernetes.io/name: podinfo}
spec:
  selector: {app.kubernetes.io/name: podinfo}
  ports:
    - {name: http, port: 9898, targetPort: http}
    - {name: metrics, port: 9797, targetPort: metrics}
