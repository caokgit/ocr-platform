apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
  - ../policies
  - issuer.yaml
  - secret-store.yaml
  - storage-class.yaml
  - karpenter.yaml
  - envoy-proxy.yaml
patches:
  # Public hostnames and Let's Encrypt instead of the lab CA.
  - target: {kind: Gateway, name: public}
    patch: |
      - op: replace
        path: /metadata/annotations/cert-manager.io~1cluster-issuer
        value: letsencrypt
      - op: replace
        path: /spec/listeners/1/hostname
        value: "*.ocr-platform.example"
  - target: {kind: GatewayClass, name: eg}
    patch: |
      - op: add
        path: /spec/parametersRef
        value: {group: gateway.envoyproxy.io, kind: EnvoyProxy, name: nlb, namespace: envoy-gateway-system}
