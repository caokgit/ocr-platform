# Public certificates from Let's Encrypt, proven by a DNS-01 record in Route 53 (cert-manager's Pod Identity role).
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: platform@ocr-platform.example
    privateKeySecretRef:
      name: letsencrypt-account
    solvers:
      - dns01:
          route53:
            region: ap-southeast-1
