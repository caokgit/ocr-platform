# AWS Secrets Manager as LocalStack serves it; LocalStack's fixed test keys, public by design, not a secret.
apiVersion: v1
kind: Secret
metadata:
  name: localstack-keys
  namespace: external-secrets
stringData:
  access-key: test
  secret-key: test
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: ap-southeast-1
      auth:
        secretRef:
          accessKeyIDSecretRef:
            name: localstack-keys
            namespace: external-secrets
            key: access-key
          secretAccessKeySecretRef:
            name: localstack-keys
            namespace: external-secrets
            key: secret-key
