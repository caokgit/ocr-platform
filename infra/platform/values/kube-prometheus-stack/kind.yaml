# kind's control plane components listen on localhost only, so their scrapes would only raise alerts.
kubeEtcd: {enabled: false}
kubeScheduler: {enabled: false}
kubeControllerManager: {enabled: false}
kubeProxy: {enabled: false}

prometheus:
  prometheusSpec:
    retention: 2d
    resources:
      requests: {cpu: 100m, memory: 384Mi}
      limits: {memory: 1Gi}
alertmanager:
  alertmanagerSpec:
    resources:
      requests: {cpu: 10m, memory: 32Mi}
      limits: {memory: 96Mi}
grafana:
  # Grafana's first start runs its database migrations, which went past 256 MiB (OOM-killed).
  resources:
    requests: {cpu: 50m, memory: 192Mi}
    limits: {memory: 512Mi}
  service:
    type: LoadBalancer
prometheusOperator:
  resources:
    requests: {cpu: 20m, memory: 48Mi}
    limits: {memory: 192Mi}
