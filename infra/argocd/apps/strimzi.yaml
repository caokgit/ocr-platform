# Strimzi operator: runs Kafka and its topics from infra/argocd/lab-data/, watching lab-data only
# (docs/specs/data-path.md#cdc-and-kafka, rows 12 and 23). It creates role bindings in lab-data, so it retries
# until the lab-data app has made that namespace.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: strimzi
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://strimzi.io/charts/
    chart: strimzi-kafka-operator
    targetRevision: 1.3.0
    helm:
      valuesObject:
        watchNamespaces: [lab-data]
        resources:
          requests: {cpu: 100m, memory: 384Mi}
          limits: {memory: 384Mi}
  destination:
    server: https://kubernetes.default.svc
    namespace: strimzi
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 10
      backoff: {duration: 15s, factor: 2, maxDuration: 3m}
