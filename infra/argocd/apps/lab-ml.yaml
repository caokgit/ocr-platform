# The training platform's own objects, plain manifests in infra/argocd/lab-ml/: the namespaces ai-team and mlflow
# with their memory budget, and the queue (docs/specs/training-platform.md#layout). Kueue's types may not exist on
# a first sync, so dry runs skip them and syncs retry.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: lab-ml
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:caokgit/ocr-platform.git
    targetRevision: main
    path: infra/argocd/lab-ml
  destination:
    server: https://kubernetes.default.svc
    namespace: ai-team
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - SkipDryRunOnMissingResource=true
      - ServerSideApply=true
    retry:
      limit: 10
      backoff: {duration: 15s, factor: 2, maxDuration: 3m}
