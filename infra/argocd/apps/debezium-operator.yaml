# Debezium Operator: runs the DebeziumServer added in build step 4, watching lab-data only
# (docs/specs/data-path.md#decisions, rows 9 and 23). Its chart has no memory value: the LimitRange of its
# namespace (infra/argocd/lab-data/namespaces.yaml) sets the pod's limit.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: debezium-operator
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://charts.debezium.io
    chart: debezium-operator
    targetRevision: 3.7.0
    helm:
      valuesObject:
        app:
          envs:
            QUARKUS_OPERATOR_SDK_CONTROLLERS_DEBEZIUMSERVER_NAMESPACES: lab-data
  destination:
    server: https://kubernetes.default.svc
    namespace: debezium-operator
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
    retry:
      limit: 10
      backoff: {duration: 15s, factor: 2, maxDuration: 3m}
