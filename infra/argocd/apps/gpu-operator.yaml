# NVIDIA GPU Operator without its driver and toolkit: the box's own are used
# (docs/specs/gpu-box-platform.md#gpu-stack, rows 3 and 4).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gpu-operator
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://helm.ngc.nvidia.com/nvidia
    chart: gpu-operator
    targetRevision: v26.7.2
    helm:
      valuesObject:
        driver:
          enabled: false
        toolkit:
          enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: gpu-operator
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
