# Kubeflow Spark Operator: launches the SparkApplications started from the laptop, in lab-data only
# (docs/specs/data-path.md#decisions, rows 15 and 23). Its pod webhook touches only pods it launched.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: spark-operator
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://kubeflow.github.io/spark-operator
    chart: spark-operator
    targetRevision: 2.5.2
    helm:
      valuesObject:
        spark:
          jobNamespaces: [lab-data]
        controller:
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 256Mi}
        webhook:
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 256Mi}
  destination:
    server: https://kubernetes.default.svc
    namespace: spark-operator
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 10
      backoff: {duration: 15s, factor: 2, maxDuration: 3m}
