# Kafka: one node holding both KRaft roles, replication factor 1, topics only from KafkaTopic objects
# (docs/specs/data-path.md#cdc-and-kafka, rows 12 and 25). Messages up to 2 MiB: the snapshot's largest event
# is 709,490 bytes (copy 2026-11-01-ffcc03c52aea).
apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: dual-role
  namespace: lab-data
  labels:
    strimzi.io/cluster: lab-kafka
spec:
  replicas: 1
  roles: [controller, broker]
  storage:
    type: jbod
    volumes:
      - id: 0
        type: persistent-claim
        size: 10Gi
        class: local-path
        kraftMetadata: shared
        deleteClaim: false
  resources:
    requests: {cpu: 200m, memory: 1Gi}
    limits: {memory: 1536Mi}
  jvmOptions:
    -Xms: 768m
    -Xmx: 768m
---
apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: lab-kafka
  namespace: lab-data
spec:
  kafka:
    version: 4.3.1
    metadataVersion: 4.3-IV0
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
    config:
      offsets.topic.replication.factor: 1
      transaction.state.log.replication.factor: 1
      transaction.state.log.min.isr: 1
      default.replication.factor: 1
      min.insync.replicas: 1
      auto.create.topics.enable: false
      message.max.bytes: 2097152
  entityOperator:
    topicOperator:
      resources:
        requests: {cpu: 50m, memory: 256Mi}
        limits: {memory: 512Mi}
