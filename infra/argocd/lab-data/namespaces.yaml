# The data path's namespace with its memory budget, and the Debezium operator's namespace with a default limit
# its chart cannot set (docs/specs/data-path.md#box-budget, row 22).
apiVersion: v1
kind: Namespace
metadata:
  name: lab-data
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: memory
  namespace: lab-data
spec:
  hard:
    limits.memory: 8Gi
---
apiVersion: v1
kind: LimitRange
metadata:
  name: defaults
  namespace: lab-data
spec:
  limits:
    - type: Container
      default: {memory: 256Mi}
      defaultRequest: {memory: 64Mi}
---
apiVersion: v1
kind: Namespace
metadata:
  name: debezium-operator
---
apiVersion: v1
kind: LimitRange
metadata:
  name: defaults
  namespace: debezium-operator
spec:
  limits:
    - type: Container
      default: {memory: 256Mi}
      defaultRequest: {memory: 128Mi}
