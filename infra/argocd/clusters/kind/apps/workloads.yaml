# The demo workload (podinfo), after the platform it depends on.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: podinfo
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default
  source:
    repoURL: git://git.lab-infra.svc.cluster.local/ml-init.git
    targetRevision: main
    path: infra/workloads/podinfo/kind
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
  # The HPA owns the replica count once it runs.
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers: [/spec/replicas]
