# A queue worker that KEDA scales from zero on the SQS queue's depth (spec C11). On kind, SQS is LocalStack.
apiVersion: v1
kind: Secret
metadata:
  name: localstack-keys
  namespace: apps
stringData:
  AWS_ACCESS_KEY_ID: test
  AWS_SECRET_ACCESS_KEY: test
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sqs-worker
  namespace: apps
spec:
  replicas: 0
  selector:
    matchLabels: {app.kubernetes.io/name: sqs-worker}
  template:
    metadata:
      labels: {app.kubernetes.io/name: sqs-worker}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: worker
          image: amazon/aws-cli:2.31.30
          # Take up to 10 messages, spend 2 s on them, delete them; repeat.
          command: ["/bin/sh", "-c"]
          args:
            - |
              while true; do
                msgs=$(aws sqs receive-message --queue-url "$QUEUE_URL" --max-number-of-messages 10 \
                  --wait-time-seconds 5 --query 'Messages[].ReceiptHandle' --output text)
                [ -z "$msgs" ] || [ "$msgs" = "None" ] && continue
                sleep 2
                for h in $msgs; do aws sqs delete-message --queue-url "$QUEUE_URL" --receipt-handle "$h"; done
                echo "$(date -u +%H:%M:%S) $HOSTNAME processed $(echo $msgs | wc -w)"
              done
          env:
            - {name: QUEUE_URL, value: "http://localstack.lab-infra.svc.cluster.local:4566/000000000000/ocr-platform-ls-work"}
            - {name: AWS_ENDPOINT_URL, value: "http://localstack.lab-infra.svc.cluster.local:4566"}
            - {name: AWS_REGION, value: ap-southeast-1}
            - {name: HOME, value: /tmp}
          envFrom:
            - secretRef: {name: localstack-keys}
          resources:
            requests: {cpu: 20m, memory: 64Mi}
            limits: {memory: 128Mi}
---
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: localstack-sqs
  namespace: apps
spec:
  secretTargetRef:
    - {parameter: awsAccessKeyID, name: localstack-keys, key: AWS_ACCESS_KEY_ID}
    - {parameter: awsSecretAccessKey, name: localstack-keys, key: AWS_SECRET_ACCESS_KEY}
---
# One worker per 10 waiting messages, up to 5; back to zero 30 s after the queue is empty.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: sqs-worker
  namespace: apps
spec:
  scaleTargetRef: {name: sqs-worker}
  minReplicaCount: 0
  maxReplicaCount: 5
  pollingInterval: 5
  cooldownPeriod: 30
  triggers:
    - type: aws-sqs-queue
      authenticationRef: {name: localstack-sqs}
      metadata:
        queueURL: http://localstack.lab-infra.svc.cluster.local:4566/000000000000/ocr-platform-ls-work
        queueLength: "10"
        awsRegion: ap-southeast-1
        awsEndpoint: http://localstack.lab-infra.svc.cluster.local:4566
