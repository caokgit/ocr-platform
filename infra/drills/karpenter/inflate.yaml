# Pods that only fit on Karpenter's nodes (the capacity-type label exists only there), one CPU each.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inflate
  namespace: apps
spec:
  replicas: 0
  selector:
    matchLabels: {app.kubernetes.io/name: inflate}
  template:
    metadata:
      labels: {app.kubernetes.io/name: inflate}
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - {key: karpenter.sh/capacity-type, operator: Exists}
      tolerations:
        - {key: kwok.x-k8s.io/node, operator: Exists, effect: NoSchedule}
      terminationGracePeriodSeconds: 5
      containers:
        - name: pause
          image: registry.k8s.io/pause:3.10
          resources:
            requests: {cpu: "1", memory: 256Mi}
            limits: {memory: 256Mi}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: inflate
  namespace: apps
spec:
  maxUnavailable: 1
  selector:
    matchLabels: {app.kubernetes.io/name: inflate}
