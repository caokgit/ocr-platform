# The canary drill (spec C17): podinfo as an Argo Rollout. Each step shifts a share of the replicas to the new
# version, then asks Prometheus for the new pods' 5xx share; a failed analysis aborts and scales the canary away.
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: error-rate
  namespace: apps
spec:
  args:
    - name: canary-hash
  metrics:
    - name: canary-5xx-share
      initialDelay: 30s
      interval: 15s
      count: 3
      failureLimit: 0
      successCondition: result[0] < 0.01
      provider:
        prometheus:
          address: http://kube-prometheus-stack-prometheus.monitoring.svc:9090
          query: |
            (sum(rate(http_requests_total{namespace="apps", service="podinfo-rollout",
                 rollouts_pod_template_hash="{{args.canary-hash}}", status=~"5.."}[30s])) or vector(0))
            /
            sum(rate(http_requests_total{namespace="apps", service="podinfo-rollout",
                rollouts_pod_template_hash="{{args.canary-hash}}"}[30s]))
---
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: podinfo-rollout
  namespace: apps
spec:
  replicas: 5
  selector:
    matchLabels: {app.kubernetes.io/name: podinfo-rollout}
  template:
    metadata:
      labels: {app.kubernetes.io/name: podinfo-rollout}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: podinfo
          image: ghcr.io/stefanprodan/podinfo:6.16.0
          command: ["./podinfo", "--port=9898", "--port-metrics=9797"]
          ports:
            - {name: http, containerPort: 9898}
            - {name: metrics, containerPort: 9797}
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 5
          resources:
            requests: {cpu: 20m, memory: 24Mi}
            limits: {memory: 96Mi}
  strategy:
    canary:
      steps:
        - setWeight: 20
        - analysis:
            templates: [{templateName: error-rate}]
            args:
              - name: canary-hash
                valueFrom: {podTemplateHashValue: Latest}
        - setWeight: 50
        - analysis:
            templates: [{templateName: error-rate}]
            args:
              - name: canary-hash
                valueFrom: {podTemplateHashValue: Latest}
        - setWeight: 100
---
apiVersion: v1
kind: Service
metadata:
  name: podinfo-rollout
  namespace: apps
  labels: {app.kubernetes.io/name: podinfo-rollout}
spec:
  selector: {app.kubernetes.io/name: podinfo-rollout}
  ports:
    - {name: http, port: 9898, targetPort: http}
    - {name: metrics, port: 9797, targetPort: metrics}
---
# podTargetLabels keeps each pod's template hash on its series, so the analysis can read the canary alone.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: podinfo-rollout
  namespace: apps
spec:
  selector:
    matchLabels: {app.kubernetes.io/name: podinfo-rollout}
  podTargetLabels: [rollouts-pod-template-hash]
  endpoints:
    - {port: metrics, interval: 10s}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rollout-traffic
  namespace: apps
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: rollout-traffic}
  template:
    metadata:
      labels: {app.kubernetes.io/name: rollout-traffic}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: client
          image: curlimages/curl:8.17.0
          command: ["/bin/sh", "-c", "while true; do curl -s -o /dev/null -m 2 http://podinfo-rollout.apps.svc:9898/; sleep 0.05; done"]
          resources:
            requests: {cpu: 10m, memory: 8Mi}
            limits: {memory: 32Mi}
