# Used through ANSIBLE_CONFIG=$PWD/infra/ansible/ansible.cfg, with ANSIBLE_HOME=$PWD/.scratch_ansible
# (AGENTS.md, "Sessions and logins"). Paths below are relative to this file.
[defaults]
inventory = inventory.yml
interpreter_python = /usr/bin/python3
stdout_callback = default
result_format = yaml
retry_files_enabled = False

[ssh_connection]
ssh_args = -F .scratch_ssh/config
pipelining = True
