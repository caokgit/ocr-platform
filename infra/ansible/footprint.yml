# Read-only: the lab's footprint on the box since the baseline, saved masked on the laptop; the teardown
# inventory is checked against it (docs/specs/gpu-box-platform.md#teardown). Runs at the lowest CPU and disk
# priority (nice 19, ionice idle). Changes nothing on the box.
#   .venv/bin/ansible-playbook infra/ansible/footprint.yml -e "since='2026-10-30 14:54'" -e label=after-lab-down
- name: The lab's footprint on the box (read-only)
  hosts: box
  gather_facts: false
  vars:
    label: footprint
    out_dir: "{{ playbook_dir }}/../../.scratch_box/checks"
  tasks:
    - name: Read where anything changed since the baseline, what acts at boot, and the kernel state
      ansible.builtin.script:
        cmd: files/footprint.sh
        executable: nice -n 19 ionice -c 3 /bin/bash
      environment:
        SINCE: "{{ since }}"
      become: true
      register: footprint
      changed_when: false
      check_mode: false

    # The scan can run to 100,000 lines (18 MB on 2026-11-15); fed to mask.py through the shell module's stdin it
    # deadlocked (both pipes full), so it is masked from a file instead, and the unmasked file removed at once.
    - name: Keep the raw scan in a mode-600 file on the laptop, briefly
      ansible.builtin.copy:
        content: "{{ footprint.stdout }}"
        dest: "{{ out_dir }}/.footprint-raw.txt"
        mode: "0600"
      delegate_to: localhost
      changed_when: false
      check_mode: false

    - name: Save it masked (it names the AI team's paths, so it stays out of the repo), then remove the raw file
      ansible.builtin.shell:
        cmd: |
          set -e
          dest="{{ out_dir }}/{{ now(fmt='%Y-%m-%d-%H%M') }}-footprint-{{ label }}.txt"
          (umask 077; tr -d '\r' < "{{ out_dir }}/.footprint-raw.txt" | python3 {{ playbook_dir }}/../../tools/mask.py > "$dest")
          rm -f "{{ out_dir }}/.footprint-raw.txt"
          echo "$dest"
      delegate_to: localhost
      register: saved
      changed_when: false
      check_mode: false

    - name: Where it is
      ansible.builtin.debug:
        msg: "saved: {{ saved.stdout | relpath(playbook_dir ~ '/../..') }}"
