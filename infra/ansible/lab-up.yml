# Start the lab: pre-checks, k3s started (its kubelet folder mounted first), the node Ready, and the
# kubeconfig on the laptop pointing at the SSH tunnel (docs/specs/gpu-box-platform.md#ansible-playbooks).
- name: Start the lab on the GPU box
  hosts: box
  gather_facts: false
  vars_files: [vars.yml]
  tasks:
    - name: Is k3s already running?
      ansible.builtin.command: systemctl is-active k3s
      register: k3s_state
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Pre-checks
      ansible.builtin.import_tasks: tasks/pre-checks.yml
      vars:
        k3s_running: "{{ k3s_state.stdout == 'active' }}"

    - name: Start k3s (systemd mounts /var/lib/kubelet first)
      ansible.builtin.systemd_service:
        name: k3s
        state: started
      become: true

    - name: Wait for the node to be Ready
      ansible.builtin.command: /usr/local/bin/k3s kubectl get nodes --no-headers
      register: nodes
      until: nodes.rc == 0 and ' Ready ' in nodes.stdout
      retries: 30
      delay: 10
      changed_when: false
      become: true
      when: not ansible_check_mode

    - name: The kubelet's folder is the bind mount from /mnt/data
      ansible.builtin.command: findmnt -n -o SOURCE /var/lib/kubelet
      register: kubelet_mount
      changed_when: false
      failed_when: "'k3s-kubelet' not in kubelet_mount.stdout"
      when: not ansible_check_mode

    - name: Read the kubeconfig
      ansible.builtin.slurp:
        src: /etc/rancher/k3s/k3s.yaml
      register: kubeconfig
      become: true
      no_log: true
      when: not ansible_check_mode

    - name: The laptop's kubeconfig folder
      ansible.builtin.file:
        path: "{{ playbook_dir }}/../../.scratch_kube"
        state: directory
        mode: "0700"
      delegate_to: localhost

    - name: Write it on the laptop, pointing at the tunnel's end (127.0.0.1:16443)
      ansible.builtin.copy:
        content: "{{ kubeconfig.content | b64decode | replace('https://127.0.0.1:6443', 'https://127.0.0.1:16443') }}"
        dest: "{{ playbook_dir }}/../../.scratch_kube/config"
        mode: "0600"
      delegate_to: localhost
      no_log: true
      diff: false
      when: not ansible_check_mode

    - name: Wait for the data path's long-running pods to be Ready (none of a Job or a Spark run); the kubeconfig is already on the laptop, so a missing Secret can be fixed meanwhile
      ansible.builtin.shell:
        cmd: |
          k() { /usr/local/bin/k3s kubectl "$@"; }
          k get namespace {{ data_namespace }} >/dev/null 2>&1 || { echo "no {{ data_namespace }} namespace"; exit 0; }
          end=$(( $(date +%s) + {{ data_ready_timeout_s }} ))
          while :; do
            pods=$(k get pods -n {{ data_namespace }} -l '!job-name,!spark-role' --no-headers 2>/dev/null)
            notready=$(echo "$pods" | awk 'NF && ($3 != "Running" || split($2, r, "/") && r[1] != r[2])' | wc -l)
            [ -n "$pods" ] && [ "$notready" -eq 0 ] && break
            [ "$(date +%s)" -ge "$end" ] && { echo "$pods"; echo "not ready after {{ data_ready_timeout_s }} s"; exit 1; }
            sleep 10
          done
          echo "$pods"
      register: data_pods
      changed_when: false
      become: true
      when: not ansible_check_mode

    - name: The data path's pods
      ansible.builtin.debug:
        msg: "{{ data_pods.stdout_lines | default(['check mode: not read']) }}"

    - name: Reserve the AI team's GPU in Kubernetes (a placeholder pod on device minor {{ gpu_reserve_minor }}), recreated until it holds that card
      ansible.builtin.shell:
        cmd: |
          k() { /usr/local/bin/k3s kubectl "$@"; }
          ns={{ gpu_reserve_namespace }}; pod=ai-team-docker-gpu0; want=/dev/nvidia{{ gpu_reserve_minor }}
          k get namespace $ns >/dev/null 2>&1 || k create namespace $ns >/dev/null
          for try in 1 2 3 4 5 6; do
            if k get pod $pod -n $ns >/dev/null 2>&1; then
              k wait --for=condition=Ready pod/$pod -n $ns --timeout=90s >/dev/null 2>&1 || true
              if k exec $pod -n $ns -- test -e $want 2>/dev/null; then
                echo "$pod holds $want ($(k exec $pod -n $ns -- ls /dev | grep -E '^nvidia[0-9]+$' | tr '\n' ' ')), try $try"; exit 0
              fi
              echo "try $try: $pod holds $(k exec $pod -n $ns -- ls /dev 2>/dev/null | grep -E '^nvidia[0-9]+$' | tr '\n' ' ')"
              k delete pod $pod -n $ns --wait=true >/dev/null
            fi
            k apply -f - >/dev/null <<EOF
          apiVersion: v1
          kind: Pod
          metadata: {name: $pod, namespace: $ns, labels: {lab/role: gpu-reserve}}
          spec:
            runtimeClassName: nvidia
            restartPolicy: Always
            containers:
              - name: hold
                image: {{ gpu_reserve_image }}
                command: [sleep, infinity]
                resources: {limits: {nvidia.com/gpu: 1, memory: 64Mi}, requests: {cpu: 1m, memory: 32Mi}}
          EOF
          done
          echo "could not place $pod on $want"; exit 1
      register: gpu_reserve
      changed_when: "', try 1' not in gpu_reserve.stdout"
      become: true
      when: not ansible_check_mode

    - name: GPU reservation
      ansible.builtin.debug:
        msg: "{{ gpu_reserve.stdout_lines | default(['check mode: not run']) }}"

    - name: Wait for the training platform's services (Argo Workflows, Kueue, MLflow) to be Ready
      ansible.builtin.shell:
        cmd: |
          k() { /usr/local/bin/k3s kubectl "$@"; }
          end=$(( $(date +%s) + {{ data_ready_timeout_s }} ))
          for ns in {{ ml_service_namespaces | join(' ') }}; do
            k get namespace $ns >/dev/null 2>&1 || { echo "no $ns namespace"; continue; }
            while :; do
              pods=$(k get pods -n $ns -l '!job-name' --no-headers 2>/dev/null)
              notready=$(echo "$pods" | awk 'NF && ($3 != "Running" || split($2, r, "/") && r[1] != r[2])' | wc -l)
              [ -n "$pods" ] && [ "$notready" -eq 0 ] && break
              [ "$(date +%s)" -ge "$end" ] && { echo "$pods"; echo "$ns not ready after {{ data_ready_timeout_s }} s"; exit 1; }
              sleep 10
            done
            echo "$pods" | sed "s/^/$ns  /"
          done
      register: ml_pods
      changed_when: false
      become: true
      when: not ansible_check_mode

    - name: The training platform's pods
      ansible.builtin.debug:
        msg: "{{ ml_pods.stdout_lines | default(['check mode: not read']) }}"

    - name: Node
      ansible.builtin.debug:
        msg: "{{ nodes.stdout | default('check mode: not started') }}"

- name: Box check after lab-up
  ansible.builtin.import_playbook: check.yml
  vars:
    label: lab-up
