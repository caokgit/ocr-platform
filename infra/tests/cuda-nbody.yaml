# Acceptance A3 (docs/specs/gpu-box-platform.md#acceptance): one GPU, through k3s's NVIDIA runtime, runs
# NVIDIA's nbody benchmark once. It asks for one GPU only (no NVIDIA_VISIBLE_DEVICES=all), so the AI team's
# other GPU stays out of its reach. Delete it after reading its log.
apiVersion: v1
kind: Pod
metadata:
  name: cuda-nbody
  namespace: default
spec:
  restartPolicy: Never
  runtimeClassName: nvidia
  containers:
    - name: nbody
      image: nvcr.io/nvidia/k8s/cuda-sample:nbody
      args: ["nbody", "-gpu", "-benchmark"]
      resources:
        limits:
          nvidia.com/gpu: 1
          memory: 1Gi
