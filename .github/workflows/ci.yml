# Every check that needs no cloud account (spec C19). On a pull request and on a push, terraform and manifests run their
# checks only when the change touches a path those checks read (tools/ci-paths.sh, spec decision 21); docs-and-secrets
# always runs. The weekly run and a manual run check everything.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 2 * * 1" # Mondays 02:17 UTC: a pinned download or a ruleset that broke outside the repo
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  terraform:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # a push may carry many commits: its first commit's parent must be here for tools/ci-paths.sh
      # Fails the job if the change cannot be read: a broken decision never passes as a skip.
      - name: Does this change touch what this job checks?
        id: paths
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        env: # a pull request: the test merge commit against its base; a push: the commit before it against the one after
          RANGE: ${{ github.event_name == 'push' && format('{0}..{1}', github.event.before, github.sha) || 'HEAD^1..HEAD' }}
        run: tools/ci-paths.sh terraform "$RANGE"
      - name: Nothing this job checks changed; its checks are skipped
        if: steps.paths.outputs.run == 'false'
        run: echo "No Terraform under infra/aws/terraform/ and no tools/check-terraform.sh in this change"
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        if: steps.paths.outputs.run != 'false'
        with:
          terraform_version: 1.17.1
          terraform_wrapper: false
      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        if: steps.paths.outputs.run != 'false'
        with:
          tflint_version: v0.65.0
      # Trivy from its release, checksum-verified (setup-trivy's installer failed to connect on the first run).
      - name: Trivy 0.76.1
        if: steps.paths.outputs.run != 'false'
        run: |
          V=0.76.1; cd "$(mktemp -d)"
          curl -fsSLO --retry 3 https://github.com/aquasecurity/trivy/releases/download/v$V/trivy_${V}_Linux-64bit.tar.gz
          curl -fsSLO --retry 3 https://github.com/aquasecurity/trivy/releases/download/v$V/trivy_${V}_checksums.txt
          grep " trivy_${V}_Linux-64bit.tar.gz$" trivy_${V}_checksums.txt | sha256sum -c
          sudo tar -xzf trivy_${V}_Linux-64bit.tar.gz -C /usr/local/bin trivy
      - name: fmt, validate, terraform test (mocked AWS), tflint, Trivy
        if: steps.paths.outputs.run != 'false'
        env:
          GITHUB_TOKEN: ${{ github.token }} # tflint --init downloads its AWS ruleset
        run: tools/check-terraform.sh

  manifests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # a push may carry many commits: its first commit's parent must be here for tools/ci-paths.sh
      # Fails the job if the change cannot be read: a broken decision never passes as a skip.
      - name: Does this change touch what this job checks?
        id: paths
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        env:
          RANGE: ${{ github.event_name == 'push' && format('{0}..{1}', github.event.before, github.sha) || 'HEAD^1..HEAD' }}
        run: tools/ci-paths.sh manifests "$RANGE"
      - name: Nothing this job checks changed; its checks are skipped
        if: steps.paths.outputs.run == 'false'
        run: echo "No overlay, values, manifest or tools/check-manifests.sh in this change"
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        if: steps.paths.outputs.run != 'false'
        with:
          version: v3.22.1
      - name: kubeconform
        if: steps.paths.outputs.run != 'false'
        run: |
          curl -fsSLo /tmp/kc.tgz https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz
          tar -xzf /tmp/kc.tgz -C /usr/local/bin kubeconform
      - name: Render the eks and kind overlays and every add-on chart, validate them
        if: steps.paths.outputs.run != 'false'
        run: tools/check-manifests.sh eks kind

  docs-and-secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Links, anchors and secret-shaped strings in the docs
        run: python3 tools/check-docs.py
      - name: gitleaks over the whole history
        run: |
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks git --redact --no-banner .
